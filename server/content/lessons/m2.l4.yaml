id: m2.l4
module: m2
title: "Вложенные условия"
goal: "Освоить вложенные if, не терять отступы и осознанно комбинировать условия"
minutes: 8
order: 4
concepts: [nesting, if]
steps:
  - id: m2.l4.s1
    type: theory
    title: "Условие внутри условия"
    concepts: [nesting, if]
    body: |
      Внутри ветки `if` можно поставить ещё один `if`. Внутренний блок выполняется, только если внешнее условие истинно. Это как матрёшка: сначала проверяем одно, потом — второе.

      Главное — отступы. Тело внешнего `if` сдвинуто на 4 пробела, тело внутреннего — ещё на 4. `else` относится к тому `if`, на уровне которого стоит: сдвинул его влево или вправо — и логика поменялась.

      В примере сначала проверяется совершеннолетие, и только внутри — возраст для пенсии. Если человек младше 18, внутренняя проверка вообще не выполняется. Читать такую конструкцию удобнее сверху вниз: сначала внешняя развилка, потом внутренняя.
    example: |
      age = 20
      if age >= 18:
          if age >= 65:
              print("пенсионер")
          else:
              print("взрослый")
      else:
          print("ребёнок")
    aside: "Отступ — это не украшение, а часть синтаксиса: он показывает, что внутри чего лежит."

  - id: m2.l4.s2
    type: theory
    title: "Вкладывать или объединять"
    concepts: [nesting, logic]
    body: |
      Вложенность не самоцель. Если внутренняя проверка нужна только при истинном первом условии, её можно заменить одним условием с `and`. Так короче и читаемее, когда внутри одна проверка.

      Вложенность выигрывает, когда во внутренней ветке несколько действий или нужен свой `else`.

      Правило: сначала попробуй объединить условия, а вкладывай, когда без этого теряется смысл. И помни про отступы: каждый новый уровень — плюс 4 пробела. Если строк становится слишком много, возможно, стоит разбить задачу на шаги или переписать порядок проверок. Иногда три уровня вложенности сворачиваются в одну цепочку `if` / `elif`.
    example: |
      age = 30
      if age >= 18 and age < 65:
          print("взрослый")
      else:
          print("не взрослый")

  - id: m2.l4.s3
    type: predict
    title: "Куда попадёт число?"
    concepts: [nesting]
    code: |
      n = 7
      if n > 0:
          if n % 2 == 0:
              print("чётное положительное")
          else:
              print("нечётное положительное")
      else:
          print("не положительное")
    options:
      - "чётное положительное"
      - "нечётное положительное"
      - "не положительное"
      - "Ничего не выведется"
      - "Ошибка"
    answer: 1
    explanation: "7 больше нуля, поэтому входим во внешний if. Внутри проверка на чётность ложна, значит срабатывает внутренний else. Внешний else относится к проверке n > 0 и не выполняется."

  - id: m2.l4.s4
    type: parsons
    title: "Вложенная скидка"
    concepts: [nesting]
    prompt: |
      Собери программу со вложенными условиями: покупка от 1000 получает скидку 5%, от 5000 — 15%, меньше 1000 — без скидки.

      Внутри ветки скидки нужна ещё одна проверка суммы. В наборе есть лишние строки.
    lines:
      - "    if total >= 5000:"
      - '    print("без скидки")'
      - "if total >= 1000:"
      - '        print("скидка 5%")'
      - "elif total >= 5000:"
      - "else:"
      - '        print("скидка 15%")'
      - "total = int(input())"
      - "    else:"
      - '    print("скидка 10%")'
    solution:
      - "total = int(input())"
      - "if total >= 1000:"
      - "    if total >= 5000:"
      - '        print("скидка 15%")'
      - "    else:"
      - '        print("скидка 5%")'
      - "else:"
      - '    print("без скидки")'
    explanation: "Внешний if отделяет покупки от 1000, внутренний — крупные от 5000. Внутренний else относится к проверке 5000, внешний else — к проверке 1000. Перепутаешь отступ — и «без скидки» начнёт срабатывать не там."

  - id: m2.l4.s5
    type: code
    title: "Правила аттракциона"
    concepts: [nesting]
    prompt: |
      Программа читает рост (см) и возраст (полных лет) — два целых числа, каждое на своей строке.

      Выведи ровно одну фразу:

      - `нельзя` — если рост меньше 140;
      - `только с родителями` — если рост от 140, но возраст меньше 12;
      - `можно` — если рост от 140 и возраст от 12.

      Сначала проверь рост, а возраст — только внутри подходящей ветки.
    mode: io
    starter: |
      height = int(input())
      age = int(input())
      # Сначала рост, потом возраст
    fixtures:
      - stdin: |
          150
          14
        stdout: |
          можно
      - stdin: |
          155
          11
        stdout: |
          только с родителями
    hints:
      - "Сначала реши, проходит ли человек по росту: это внешнее условие."
      - "Если рост подходит, внутри проверь возраст: от 12 лет — «можно», иначе — «только с родителями»."
      - "Структура: внешний if по росту, внутри него if по возрасту со своим else, а внешний else отвечает за «нельзя»."
    solution: |
      height = int(input())
      age = int(input())
      if height >= 140:
          if age >= 12:
              print("можно")
          else:
              print("только с родителями")
      else:
          print("нельзя")
    explanation: "Внешнее условие отсекает тех, кто не проходит по росту. Для остальных работает внутренняя проверка возраста: 12 и больше — «можно», иначе нужно сопровождение. Внешний else срабатывает только при росте меньше 140."

  - id: m2.l4.s6
    type: debug
    title: "Else не на своём месте"
    concepts: [nesting]
    prompt: |
      Программа должна выводить:

      - `чётное положительное` — для положительных чётных;
      - `нечётное положительное` — для положительных нечётных;
      - `не положительное` — для нуля и отрицательных.

      Сейчас она путает ветки. Найди ошибку в отступах и исправь её.
    mode: io
    broken: |
      n = int(input())
      if n > 0:
          if n % 2 == 0:
              print("чётное положительное")
          else:
              print("не положительное")
    fixtures:
      - stdin: "3"
        stdout: |
          нечётное положительное
      - stdin: "-2"
        stdout: |
          не положительное
    hints:
      - "Запусти программу на 3: она говорит «не положительное», хотя число положительное. К какому if относится else?"
      - "Else стоит на уровне внутреннего if, поэтому ловит всех положительных нечётных. Для отрицательных ветки вообще не осталось."
      - "Структура: внешний if с else на одном уровне; внутри положительной ветки — свой if на чётность и свой else для нечётных."
    solution: |
      n = int(input())
      if n > 0:
          if n % 2 == 0:
              print("чётное положительное")
          else:
              print("нечётное положительное")
      else:
          print("не положительное")
    explanation: "Ошибка была в отступе: else принадлежал внутреннему if и срабатывал для нечётных положительных. Теперь внутренний else печатает «нечётное положительное», а внешний else — «не положительное» для нуля и отрицательных."
