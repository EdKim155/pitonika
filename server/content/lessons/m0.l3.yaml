id: m0.l3
module: m0
title: "Как читать ошибки"
goal: "Понять, где Python сообщает о проблеме, и исправлять типичные ошибки"
minutes: 8
order: 3
concepts: [error_reading, string, print]
steps:
  - id: m0.l3.s1
    type: theory
    title: "Самое важное — внизу"
    concepts: [error_reading]
    body: |
      Когда программа падает, Python печатает сообщение об ошибке — traceback. Читать его сверху вниз не нужно: самое важное находится внизу.

      Последняя строка говорит, **что** случилось: `SyntaxError`, `NameError` или `IndentationError`. Чуть выше — имя файла и номер строки, где Python заметил проблему.

      Порядок такой: сначала тип ошибки, потом строка с этим номером. Остальной текст служебный: он показывает путь программы к ошибке.

      Ошибка — не приговор, а адрес, где искать. Прочитал, исправил, запустил снова. Если сообщение длинное, не читай его целиком — найди последнюю строку и номер.
    example: |
      # main.py, строка 2
      print(привет)
    aside: "Длинное сообщение не значит «всё сломалось». Тебе нужны две вещи: тип ошибки и номер строки."

  - id: m0.l3.s2
    type: theory
    title: "Три частые ошибки"
    concepts: [error_reading, string]
    body: |
      `SyntaxError` — Python не может разобрать код. Чаще всего забыта закрывающая скобка или кавычка.

      `NameError` — имя не найдено. Например, потерялись кавычки: `print(привет)`. Python ищет переменную `привет`, а её нет.

      `IndentationError` — проблема с отступами: лишние пробелы в начале строки или разное их число там, где нужен блок.

      Действуй по шагам: прочитай тип ошибки, найди строку, исправь одну вещь и запусти снова. Так причина находится быстрее, чем при попытке переписать всё сразу.

      Иногда Python указывает на строку ниже настоящей проблемы — тогда проверь строку выше.
    example: |
      print("Привет"     # SyntaxError: не закрыта скобка
      print(привет)       # NameError: имя не найдено
          print("Пока")   # IndentationError: лишний отступ
    aside: "Одна ошибка за раз: исправил — запустил — посмотрел, что изменилось."

  - id: m0.l3.s3
    type: quiz
    title: "Найди проблемные строки"
    concepts: [error_reading, string]
    question: "Перед тобой четыре строки. Какие из них вызовут ошибку, если запустить каждую отдельно? Отметь все подходящие."
    code: |
      print("Привет"
      print(привет)
        print("Пока")
      print("Всё ок")
    options:
      - "Строка 1"
      - "Строка 2"
      - "Строка 3"
      - "Строка 4"
    answers: [0, 1, 2]
    multiple: true
    explanation: |
      В первой строке не хватает закрывающей скобки — это `SyntaxError`. Во второй `привет` стоит без кавычек, поэтому Python ищет неизвестное имя — `NameError`. В третьей лишние пробелы в начале — `IndentationError`. Четвёртая строка написана верно.

  - id: m0.l3.s4
    type: parsons
    title: "Собери программу без ошибок"
    concepts: [print, comments, error_reading]
    prompt: |
      Собери программу, которая выводит ровно две строки:

      ```
      Шаг 1: запуск
      Шаг 3: готово
      ```

      Одна из строк — комментарий. Реши, нужна ли она в программе.
    lines:
      - 'print("Шаг 3: готово")'
      - '# print("Шаг 2: отладка")'
      - 'print("Шаг 1: запуск")'
    solution:
      - 'print("Шаг 1: запуск")'
      - 'print("Шаг 3: готово")'
    explanation: "Строка с `#` — комментарий, Python её не выполняет. Если оставить её в программе, на экран попадёт лишняя строка."

  - id: m0.l3.s5
    type: debug
    title: "Лишний отступ"
    concepts: [error_reading]
    prompt: |
      Программа должна вывести:

      ```
      Всё на месте
      ```

      Но Python отказывается её запускать. Прочитай сообщение об ошибке и исправь код.
    mode: io
    broken: |
      # Программа приветствия
          print("Всё на месте")
    fixtures:
      - stdin: ""
        stdout: |
          Всё на месте
      - stdin: |
          лишний ввод
        stdout: |
          Всё на месте
    hints:
      - "Прочитай последнюю строку сообщения: там написан тип ошибки."
      - "Проблема не в тексте и не в кавычках, а в начале строки."
      - "Структура: команда должна начинаться с первого символа строки, без пробелов перед `print`."
    solution: |
      # Программа приветствия
      print("Всё на месте")
    explanation: "Четыре пробела в начале делают строку «вложенной», но блока перед ней нет. Убери отступ — и программа запустится."

  - id: m0.l3.s6
    type: code
    title: "Сообщение об ошибке — это текст"
    concepts: [error_reading, string, print]
    prompt: |
      Выведи ровно такую строку:

      ```
      NameError: name 'привет' is not defined
      ```

      Это не код ошибки, а обычный текст. Проверь, что кавычки не мешают друг другу.
    mode: io
    starter: |
      # Выведи сообщение как обычную строку
    fixtures:
      - stdin: ""
        stdout: |
          NameError: name 'привет' is not defined
      - stdin: |
          посторонний ввод
        stdout: |
          NameError: name 'привет' is not defined
    hints:
      - "Вся строка — один текст, значит, нужен один `print`."
      - "Внутри есть апострофы, поэтому снаружи выбери другие кавычки."
      - "Структура: `print(\"…\")`, весь текст — внутри одной пары двойных кавычек."
    solution: |
      print("NameError: name 'привет' is not defined")
    explanation: "Сообщение об ошибке — просто строка. Одинарные кавычки внутри неё безопасны, потому что внешние — двойные."
