id: m1.l4
module: m1
title: "input и приведение типов"
goal: "Научиться читать ввод с клавиатуры и превращать строки в числа"
minutes: 9
order: 4
concepts: [input, int, type_conversion]
steps:
  - id: m1.l4.s1
    type: theory
    title: "input() возвращает строку"
    concepts: [input]
    body: |
      Команда `input()` показывает приглашение и ждёт, пока пользователь введёт текст и нажмёт Enter. Всё, что он набрал, `input()` возвращает **строкой**. Даже если на экране появилось число, внутри программы это текст.

      Текст в скобках называется приглашением: он подсказывает, что нужно ввести. Приглашение необязательно, и в задачах с точным выводом его обычно не пишут.

      Поэтому значение из `input()` нельзя сразу складывать с числом: для Python `"5"` и `5` — разные вещи. Строку можно сравнивать и повторять, но арифметика с ней не сработает так, как ты ждёшь.

      Чтобы получить из введённого текста число, строку нужно **превратить в число**. Этим занимаются функции `int()` и `float()`.
    example: |
      name = input()
      print("Привет, " + name + "!")
    aside: "Если нажать Enter без текста, input() вернёт пустую строку — это тоже строка."

  - id: m1.l4.s2
    type: theory
    title: "int() и float()"
    concepts: [type_conversion, int]
    body: |
      `int()` превращает строку из цифр в целое число, а `float()` — в дробное. Например, `int("42")` даёт `42`, а `float("3.5")` — `3.5`.

      Обычно приведение делают прямо при вводе: `age = int(input())`. Так в переменной окажется число, и с ним можно считать. Для дробных значений пишут `float(input())`.

      Приведение работает и с уже сохранённой строкой: `text = "15"`, затем `number = int(text)`. Исходная строка при этом не меняется — создаётся новое значение.

      Если строка не похожа на число, например `int("привет")`, Python выбросит `ValueError`. Поэтому важно, чтобы пользователь действительно ввёл число.

      Для двух чисел вызывай `input()` дважды: каждый вызов читает одну строку.
    example: |
      age = int(input())
      print(age + 1)
    aside: "Последняя строка ошибки обычно и есть самая полезная: там написано, что именно не подошло."

  - id: m1.l4.s3
    type: predict
    title: "Строка или число?"
    concepts: [input, type_conversion]
    question: "Пользователь вводит 5. Что выведет программа?"
    code: |
      value = input()
      print(value * 2)
    options:
      - "10"
      - "55"
      - "5"
      - "Ошибка TypeError"
    answer: 1
    explanation: 'input() вернёт строку "5". Умножение строки на 2 повторяет её: получится "55", а не 10.'

  - id: m1.l4.s4
    type: blank
    title: "Сложение двух чисел"
    concepts: [type_conversion, int]
    prompt: "Программа должна прочитать два целых числа с клавиатуры и вывести их сумму. Заполни пропуски."
    template: |
      a = {{1}}(input())
      b = {{2}}(input())
      print(a + b)
    blanks:
      - answer: "int"
        accept: ["int"]
        hint: "Целое число"
      - answer: "int"
        accept: ["int"]
        hint: "Целое число"
    explanation: "Каждый input() возвращает строку, поэтому перед сложением оба значения превращают в int. Иначе Python склеит строки."

  - id: m1.l4.s5
    type: code
    title: "Сумма двух чисел"
    concepts: [input, int, type_conversion]
    prompt: |
      Напиши программу, которая читает два целых числа — каждое на отдельной строке — и выводит их сумму.

      Например, при вводе:
      ```
      3
      4
      ```
      программа должна вывести `7`.
    mode: io
    starter: |
      # Прочитай два числа и выведи их сумму
    fixtures:
      - stdin: |
          3
          4
        stdout: |
          7
      - stdin: |
          -5
          8
        stdout: |
          3
    hints:
      - "input() возвращает строку, даже если пользователь ввёл цифры."
      - "Преврати каждый ввод в целое число через int() до сложения."
      - "Структура: два чтения ввода, два приведения int() и один print с суммой."
    solution: |
      a = int(input())
      b = int(input())
      print(a + b)
    explanation: "Каждый input() читает одну строку. int() превращает текст в число, после этого + выполняет сложение, а не склейку строк."

  - id: m1.l4.s6
    type: debug
    title: "Среднее двух чисел"
    concepts: [type_conversion, operators]
    prompt: |
      Программа должна читать два числа и выводить их среднее арифметическое. Сейчас она падает с ошибкой.

      Найди причину и исправь код.
    mode: io
    broken: |
      a = input()
      b = input()
      print((a + b) / 2)
    fixtures:
      - stdin: |
          3
          4
        stdout: |
          3.5
      - stdin: |
          10
          10
        stdout: |
          10.0
    hints:
      - "Прочитай последнюю строку ошибки: Python говорит, что операция не подходит для этих типов."
      - "input() возвращает строки, а делить строку на число нельзя."
      - "Структура: приведи оба ввода к числу через float(), затем сложи и раздели."
    solution: |
      a = float(input())
      b = float(input())
      print((a + b) / 2)
    explanation: "Числа из input() приходят строками. float() превращает их в дробные числа, поэтому сложение и деление работают. Результат деления всегда float: 10.0, а не 10."
