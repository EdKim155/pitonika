id: m2.l1
module: m2
title: "if и else"
goal: "Научиться выбирать одну из двух веток программы"
minutes: 8
order: 1
concepts: [if, comparison]
steps:
  - id: m2.l1.s1
    type: theory
    title: "Две ветки программы"
    concepts: [if]
    body: |
      Иногда программа должна выбрать один из двух вариантов. Для этого есть `if`: после условия ставят двоеточие, а команды ветки пишут с отступом. Если условие истинно, Python выполнит эти команды. Если ложно — пропустит весь блок.

      Команда `else` задаёт второй вариант. Она пишется на том же уровне, что и `if`, и тоже с двоеточием. Её блок сработает, когда условие не выполнилось.

      Внутри блоков нужен отступ, обычно четыре пробела. Отступ показывает Python, какие строки относятся к ветке. Без него программа не запустится. Если в ветке несколько строк, все они пишутся на одном уровне.

      Проверь, что обе ветки решают одну и ту же задачу, но с разными результатами: одна — когда условие истинно, другая — когда ложно.
    example: |
      age = 20
      if age >= 18:
          print("Доступ разрешён")
      else:
          print("Доступ запрещён")
    aside: "Двоеточие после условия — обязательная часть синтаксиса, а не украшение."

  - id: m2.l1.s2
    type: theory
    title: "Сравнения и два знака равенства"
    concepts: [comparison]
    body: |
      Условие — это выражение, которое даёт `True` или `False`. Для сравнения используют операторы: `==` — равно, `!=` — не равно, `<` и `>` — меньше и больше, `<=` и `>=` — с учётом равенства. Например, `5 > 3` даёт `True`, а `2 > 7` — `False`.

      Проверка на равенство — это два знака `==`. Один знак `=` выполняет присваивание: `age = 18` записывает число в переменную, а не сравнивает его. Внутри `if` такой код вызовет ошибку. Порядок знаков тоже важен: `=>` и `=<` в Python не существуют.

      Сравнивать можно и строки: `"да" == "да"` даёт `True`. В условии можно сравнивать переменную с числом, строкой или другой переменной. Результат сравнения можно сразу использовать в условии.
    example: |
      answer = input()
      if answer == "да":
          print("Согласен")
      else:
          print("Не согласен")
    aside: "Строки сравниваются с учётом регистра: «да» и «Да» — разные строки."

  - id: m2.l1.s3
    type: quiz
    title: "Как записать условие?"
    concepts: [if, comparison]
    question: "В каком варианте условие проверяет, что возраст равен 18?"
    options:
      - "if age = 18:"
      - "if age == 18:"
      - "if age => 18:"
      - "if age === 18:"
    answers: [1]
    explanation: "Равенство проверяют двумя знаками ==. Один знак = — это присваивание, а записи => и === в Python не существуют."

  - id: m2.l1.s4
    type: parsons
    title: "Собери проверку возраста"
    concepts: [if, comparison]
    prompt: |
      Собери программу: она читает возраст и выводит «Можно», если возраст 18 или больше, иначе выводит «Нельзя». Некоторые строки лишние: их не нужно использовать.
    lines:
      - 'age = int(input())'
      - 'if age >= 18'
      - 'print("Можно")'
      - 'if age >= 18:'
      - '    print("Можно")'
      - 'else:'
      - '    print("Нельзя")'
    solution:
      - 'age = int(input())'
      - 'if age >= 18:'
      - '    print("Можно")'
      - 'else:'
      - '    print("Нельзя")'
    explanation: "После условия нужно двоеточие, а команды внутри if и else пишутся с отступом. Без отступа Python не поймёт, какая строка относится к ветке."

  - id: m2.l1.s5
    type: code
    title: "Проверка пароля"
    concepts: [if, comparison]
    prompt: |
      Напиши программу, которая читает пароль и выводит `Доступ открыт`, если пароль равен `python`, иначе выводит `Доступ закрыт`.

      Сравнение чувствительно к регистру: `Python` не подходит.
    mode: io
    starter: |
      # Прочитай пароль и сравни его со словом python
    fixtures:
      - stdin: |
          python
        stdout: |
          Доступ открыт
      - stdin: |
          Python
        stdout: |
          Доступ закрыт
    hints:
      - "input() возвращает строку, а строки можно сравнивать через ==."
      - "Пароль нужно сравнить ровно со словом python, без лишних пробелов и кавычек в тексте."
      - "Структура: прочитай пароль, затем if с проверкой равенства и два print в ветках."
    solution: |
      password = input()
      if password == "python":
          print("Доступ открыт")
      else:
          print("Доступ закрыт")
    explanation: "Условие password == \"python\" даёт True только при точном совпадении. Если совпадения нет, выполняется ветка else."

  - id: m2.l1.s6
    type: debug
    title: "Найди ошибку в условии"
    concepts: [if, comparison]
    prompt: |
      Программа должна сравнить возраст с 18, но не запускается: Python сообщает об ошибке синтаксиса.

      Найди ошибку и исправь код.
    mode: io
    broken: |
      age = int(input())
      if age = 18:
          print("Совпало")
      else:
          print("Не совпало")
    fixtures:
      - stdin: |
          18
        stdout: |
          Совпало
      - stdin: |
          17
        stdout: |
          Не совпало
    hints:
      - "Прочитай последнюю строку ошибки: Python указывает на строку с if."
      - "В условии нужен оператор сравнения, а не присваивание."
      - "Структура условия: if, переменная, оператор равенства, значение и двоеточие. Подумай, сколько знаков в операторе равенства."
    solution: |
      age = int(input())
      if age == 18:
          print("Совпало")
      else:
          print("Не совпало")
    explanation: "Один знак = записывает значение в переменную, поэтому внутри if он недопустим. Для проверки равенства нужен оператор ==."
