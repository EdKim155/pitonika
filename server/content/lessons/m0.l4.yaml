id: m0.l4
module: m0
title: "Босс модуля: первая программа"
goal: "Собрать первую настоящую программу из print, строк и комментариев"
minutes: 10
order: 4
concepts: [print, string, comments, error_reading]
steps:
  - id: m0.l4.s1
    type: theory
    title: "Комментарии — заметки для людей"
    concepts: [comments]
    body: |
      Комментарий — это заметка в коде для людей. Python её не выполняет.

      ```python
      # Приветствие
      print("Привет!")  # это тоже комментарий
      ```

      Всё, что стоит после `#`, Python пропускает до конца строки. Комментарий может занимать целую строку или стоять после кода.

      Зачем это нужно: объяснить будущему себе, что делает программа. Хороший комментарий отвечает на вопрос «зачем», а не пересказывает «что».

      Пиши коротко и по делу: `# считаем итог` лучше, чем десять строк объяснений. На вывод программы комментарии не влияют — это легко проверить запуском. Комментарии помогают и тебе самому, когда возвращаешься к коду через неделю.
    example: |
      # Моя первая программа
      print("Привет!")
      print("Питон" + " учится")  # склеиваем строки
    aside: "Комментарий — не команда. Python видит `#` и просто идёт дальше."

  - id: m0.l4.s2
    type: theory
    title: "Собираем всё вместе"
    concepts: [print, string, comments, error_reading]
    body: |
      Перед боссом соберём всё вместе. Программа — это набор инструкций, которые Python выполняет сверху вниз.

      `print("…")` выводит строку. Кавычки бывают одинарными и двойными, но в одной строке они должны совпадать. `+` склеивает строки, и пробел нужно ставить самому. `#` прячет заметки от Python.

      Порядок работы: придумай, что должно появиться на экране, напиши по одной инструкции на строку, запусти и сравни результат.

      Если что-то не так — читай ошибку с последней строки. Ошибка не делает тебя хуже, она показывает, где код расходится с замыслом. Не бойся экспериментировать: запуск ничего не ломает.
    example: |
      # Итоговая программа
      print("Я учусь в Питонике")
      print("Строки" + " — это просто")
    aside: "Сначала запусти маленький кусок, потом добавляй следующую строку."

  - id: m0.l4.s3
    type: predict
    title: "Что выведет программа?"
    concepts: [print, string, comments]
    code: |
      # Приветствие
      print("Раз" + " и " + "два")
      # print("Три")
      print("Готово")
    options:
      - |-
        Раз и два
        Готово
      - |-
        Раз и два
        Три
        Готово
      - |-
        Приветствие
        Раз и два
        Готово
      - |-
        Раз, и, два
        Готово
    answer: 0
    explanation: |
      Строка с `#` — комментарий, Python её не выполняет, поэтому «Три» не появится. `+` склеивает части без лишних пробелов, а каждый `print` начинает новую строку.

  - id: m0.l4.s4
    type: parsons
    title: "Собери программу с комментарием"
    concepts: [print, string, comments]
    prompt: |
      Собери программу, которая выводит ровно одну строку:

      ```
      Первая программа готова!
      ```

      Первой строкой должен идти комментарий `# Мой первый проект`.
    lines:
      - 'print("Первая программа " + "готова!")'
      - '# Мой первый проект'
      - 'print("Первая " + "программа готова")'
    solution:
      - '# Мой первый проект'
      - 'print("Первая программа " + "готова!")'
    explanation: "Комментарий начинается с `#` и на экран не попадает. Во второй строке части склеиваются с пробелом, а восклицательный знак стоит в конце."

  - id: m0.l4.s5
    type: code
    title: "Первая программа целиком"
    concepts: [print, string]
    prompt: |
      Напиши программу, которая выводит ровно три строки:

      ```
      Моя первая программа
      запущена без ошибок
      и это только начало!
      ```

      Каждая строка — отдельный `print`, кавычки должны быть парными.
    mode: io
    starter: |
      # Твоя первая программа
    fixtures:
      - stdin: ""
        stdout: |
          Моя первая программа
          запущена без ошибок
          и это только начало!
      - stdin: |
          посторонний ввод
        stdout: |
          Моя первая программа
          запущена без ошибок
          и это только начало!
    hints:
      - "Строк три, значит, и команд `print` понадобится три."
      - "Сверь текст посимвольно: пробелы, запятая и восклицательный знак важны."
      - "Структура: `print(\"…\")`, `print(\"…\")`, `print(\"…\")` — сверху вниз, без пустых строк."
    solution: |
      print("Моя первая программа")
      print("запущена без ошибок")
      print("и это только начало!")
    explanation: "Каждый `print` выводит одну строку и завершает её переводом строки. Порядок вызовов задаёт порядок строк на экране."

  - id: m0.l4.s6
    type: debug
    title: "Босс: найди две проблемы"
    concepts: [print, string, comments, error_reading]
    prompt: |
      Программа должна вывести:

      ```
      Привет, Питон!
      Питон рулит
      ```

      Но она падает ещё до запуска. Найди все проблемы и исправь их.
    mode: io
    broken: |
      # Приветствие
      print("Привет, Питон!)
      print("Питон" + "рулит")
    fixtures:
      - stdin: ""
        stdout: |
          Привет, Питон!
          Питон рулит
      - stdin: |
          любой текст
        stdout: |
          Привет, Питон!
          Питон рулит
    hints:
      - "Сначала запусти программу: Python покажет строку, на которой он застрял."
      - "Первая проблема — незакрытая кавычка. После её исправления появится вторая: слова слиплись."
      - "Структура: в первом `print` — парные двойные кавычки, во втором — `+` и пробел в начале второй строки."
    solution: |
      # Приветствие
      print("Привет, Питон!")
      print("Питон" + " рулит")
    explanation: "Без закрывающей кавычки Python не может разобрать программу. Когда синтаксис исправлен, остаётся добавить пробел — и вывод совпадает с образцом."
