id: m0.l2
module: m0
title: "Кавычки и строки"
goal: "Разобраться с одинарными и двойными кавычками и научиться склеивать строки"
minutes: 8
order: 2
concepts: [string, print]
steps:
  - id: m0.l2.s1
    type: theory
    title: "Кавычки должны совпадать"
    concepts: [string]
    body: |
      Строка — это текст в кавычках. Python понимает и двойные `"`, и одинарные `'`. Правило одно: кавычка в начале и кавычка в конце должны совпадать.

      Если внутри текста уже есть кавычка, поставь снаружи другую:

      ```python
      print('Он сказал "привет"')
      ```

      Сами кавычки на экран не попадают: `print("Привет")` выведет `Привет`. Это граница текста, а не его часть.

      Одинарная кавычка внутри двойных — обычный символ. Поэтому апостроф не ломает строку: `print("It's Python")` работает. Выбирай тот стиль, который удобнее, но не смешивай кавычки в одной строке. Проверить легко: найди открывающую кавычку и убедись, что такая же стоит в конце строки.
    example: |
      print("Привет")
      print('Привет')
      print('Он сказал "привет"')
    aside: "Правило простое: открыл двойную кавычку — закрой её двойной."

  - id: m0.l2.s2
    type: quiz
    title: "Какая строка сработает?"
    concepts: [string]
    question: "Нужно вывести текст: Сегодня отличный день! Какая строка сработает?"
    options:
      - 'print("Сегодня отличный день!")'
      - "print('Сегодня отличный день!\")"
      - "print(Сегодня отличный день!)"
      - 'print("Сегодня отличный день!)'
    answers: [0]
    explanation: |
      В первой строке кавычки парные: открывающая и закрывающая — двойные. Во второй они разные, в третьей кавычек нет вовсе, а в четвёртой не хватает закрывающей.

  - id: m0.l2.s3
    type: theory
    title: "Склеиваем строки"
    concepts: [string, print]
    body: |
      Строки можно соединять оператором `+`. Это называется конкатенацией.

      ```python
      print("Привет, " + "мир!")
      ```

      На экране получится `Привет, мир!`. `+` сам не добавляет пробел: его нужно заранее поставить внутри одной из строк.

      Склеивать можно сколько угодно частей: `print("А" + "Б" + "В")`. Главное, чтобы с обеих сторон от `+` были строки в кавычках.

      Порядок важен: `print("мир" + "Привет")` даст другой текст. Пробел — такой же символ, как буква. Если забыть про него, слова слипнутся в `Приветмир`, поэтому проверяй результат запуском.

      Совет: собирай длинную фразу по частям и после каждого шага запускай программу. Так проще заметить, где потерялся пробел или запятая.
    example: |
      print("Питон" + "ика")
      print("Привет, " + "мир!")
      print("А" + "Б" + "В")
    aside: "Конкатенация пригодится, когда части фразы известны по отдельности."

  - id: m0.l2.s4
    type: blank
    title: "Собери фразу из двух строк"
    concepts: [string]
    prompt: |
      Допиши две строки вместе с кавычками так, чтобы программа вывела ровно:

      ```
      Питон, вперёд!
      ```
    template: |
      print({{1}} + {{2}})
    blanks:
      - answer: '"Питон"'
        accept: ["'Питон'"]
        hint: "Первая часть"
      - answer: '", вперёд!"'
        accept: ["', вперёд!'"]
        hint: "Запятая и пробел"
    explanation: "`+` соединяет строки как есть. Запятая и пробел стоят в начале второй строки — поэтому между словами получился ровно один пробел."

  - id: m0.l2.s5
    type: code
    title: "Апостроф внутри строки"
    concepts: [string, print]
    prompt: |
      Выведи ровно одну строку:

      ```
      It's Python
      ```

      Собери её из двух частей с помощью `+`: первая часть — `It's`, вторая — ` Python`.
    mode: io
    starter: |
      # Собери фразу из двух частей
    fixtures:
      - stdin: ""
        stdout: |
          It's Python
      - stdin: |
          посторонний ввод
        stdout: |
          It's Python
    hints:
      - "Снаружи нужны двойные кавычки: внутри строки уже есть апостроф."
      - "Две части соединяет `+`, а пробел должен оказаться между словами."
      - "Структура: `print(\"…\" + \"…\")`, причём пробел стоит первым символом второй строки."
    solution: |
      print("It's" + " Python")
    explanation: "Апостроф внутри двойных кавычек — обычный символ. Пробел мы добавили в начало второй строки, поэтому слова не слиплись."

  - id: m0.l2.s6
    type: debug
    title: "Слипшиеся слова"
    concepts: [string, print, error_reading]
    prompt: |
      Программа должна вывести:

      ```
      Питон рулит
      ```

      Ошибки нет, но слова слиплись. Запусти код, найди причину и исправь её.
    mode: io
    broken: |
      print("Питон" + "рулит")
    fixtures:
      - stdin: ""
        stdout: |
          Питон рулит
      - stdin: |
          любой текст
        stdout: |
          Питон рулит
    hints:
      - "Сравни то, что выводится, с тем, что нужно получить."
      - "Программа работает, но `+` не добавляет пробел сам."
      - "Структура: `print(\"…\" + \" …\")` — пробел должен быть первым символом второй строки."
    solution: |
      print("Питон" + " рулит")
    explanation: "Кавычки закрываются сразу после слова, поэтому пробела нет. Достаточно добавить его в начало второй строки."
