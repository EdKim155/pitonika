id: m1.l2
module: m1
title: "Числа и арифметика"
goal: "Понять разницу int и float, научиться считать с // и % и соблюдать порядок операций"
minutes: 9
order: 2
concepts: [int, float, operators, operators_priority]
steps:
  - id: m1.l2.s1
    type: theory
    title: "Целые и дробные"
    concepts: [int, float]
    body: |
      В Python два основных числовых типа. `int` — целые числа: `1`, `42`, `-7`. `float` — дробные: `3.14`, `0.5`, `-2.0`. Дробную часть отделяют точкой, а не запятой: `3,14` Python прочитает как два числа, разделённых запятой, а не как дробь. Обычное деление `/` всегда даёт `float`, даже если делится нацело: `6 / 2` вернёт `3.0`. Сложение, вычитание и умножение целых дают целое, а если хотя бы один операнд дробный, результат тоже дробный. Результат арифметики тоже имеет тип: `7 + 1` — int, `7 + 1.0` — float. Дробные числа хранятся приближённо, поэтому сравнивать их «в лоб» стоит осторожно.
    example: |
      whole = 7
      fraction = 2.5
      print(whole)
      print(fraction)
      print(whole + fraction)
    aside: "`1.0` — это float, хотя выглядит как целое. Тип зависит от записи, а не от значения."

  - id: m1.l2.s2
    type: theory
    title: "Операторы и приоритет"
    concepts: [operators, operators_priority]
    body: |
      Основные операторы: `+`, `-`, `*`, `/`, `//` и `%`. Целочисленное деление `//` отбрасывает дробную часть: `17 // 5` даёт `3`. Остаток `%` показывает, что осталось: `17 % 5` даёт `2`. Вместе они разбирают число на целую часть и остаток. Порядок действий как в математике: сначала скобки, затем `*`, `/`, `//`, `%`, и только потом `+` и `-`. Поэтому `2 + 3 * 4` равно `14`, а `(2 + 3) * 4` равно `20`. Операторы можно комбинировать в одном выражении, и Python вычислит его с учётом приоритета. Скобки меняют порядок: всё, что внутри них, считается первым. Например, `10 - 2 * 3` равно `4`, а `(10 - 2) * 3` равно `24`. Если сомневаешься — ставь скобки, это не ошибка.
    example: |
      total = 2 + 3 * 4
      fixed = (2 + 3) * 4
      print(total)
      print(fixed)

  - id: m1.l2.s3
    type: predict
    title: "Что напечатает?"
    concepts: [operators]
    code: |
      print(7 // 2)
      print(7 % 2)
    options:
      - "3 и 1 — каждое на своей строке"
      - "3.5 и 1"
      - "4 и 1"
      - "3 и 3"
    answer: 0
    explanation: "7 // 2 — целая часть деления, то есть 3. 7 % 2 — остаток, то есть 1. Обычное 7 / 2 дало бы 3.5."

  - id: m1.l2.s4
    type: blank
    title: "Часы и минуты"
    concepts: [operators]
    prompt: "В 125 минутах 2 полных часа и 5 минут в остатке. Допиши подходящие операторы."
    template: |
      minutes = 125
      hours = minutes {{1}} 60
      rest = minutes {{2}} 60
      print(hours)
      print(rest)
    blanks:
      - answer: "//"
        accept: []
        hint: "Целая часть деления"
      - answer: "%"
        accept: []
        hint: "Остаток от деления"
    explanation: "`//` оставляет целую часть, `%` — остаток. 125 // 60 = 2, 125 % 60 = 5."

  - id: m1.l2.s5
    type: code
    title: "Раздели яблоки"
    concepts: [operators, int, float]
    prompt: |
      Есть 17 яблок и 5 детей. Создай переменные:

      - `total_apples` со значением `17`;
      - `kids` со значением `5`;
      - `apples_per_kid` — сколько целых яблок достанется каждому;
      - `leftover` — сколько яблок останется;
      - `average` — среднее число яблок на ребёнка.

      Считай от переменных `total_apples` и `kids`. Выводить ничего не нужно: проверка посмотрит значения.
    mode: unit
    starter: |
      # Создай переменные ниже
    tests:
      - name: "apples_per_kid"
        call: "apples_per_kid"
        expected: 3
      - name: "leftover"
        call: "leftover"
        expected: 2
      - name: "average"
        call: "average"
        expected: 3.4
        approx: true
    hints:
      - "Подумай, чем целая часть отличается от остатка и от среднего значения."
      - "Для целой части нужен `//`, для остатка — `%`, а для среднего подойдёт обычное деление `/`."
      - "Структура: сначала две переменные с числами, затем три строки с вычислениями через `//`, `%` и `/`. Числа заново не переписывай."
    solution: |
      total_apples = 17
      kids = 5
      apples_per_kid = total_apples // kids
      leftover = total_apples % kids
      average = total_apples / kids
    explanation: "`//` и `%` работают в паре: делят нацело и показывают остаток. `/` всегда даёт дробный результат, поэтому average равно 3.4."

  - id: m1.l2.s6
    type: debug
    title: "Найди ошибку: скобки решают"
    concepts: [operators, operators_priority]
    prompt: |
      Коробка: длина 7, ширина 4, высота 3. Программа должна считать площадь основания `area`, периметр `perimeter` и объём `volume`, но две формулы записаны неверно. Исправь `area` и `perimeter`, строку с `volume` не трогай.
    mode: unit
    broken: |
      length = 7
      width = 4
      height = 3
      area = length + width
      perimeter = 2 * length + width
      volume = area * height
    tests:
      - name: "area"
        call: "area"
        expected: 28
      - name: "perimeter"
        call: "perimeter"
        expected: 22
      - name: "volume"
        call: "volume"
        expected: 84
    hints:
      - "Проверь, какая формула должна быть у площади, а какая — у периметра."
      - "Площадь — произведение сторон, периметр — удвоенная сумма длины и ширины. Без скобок удвоится только длина."
      - "Структура: в `area` нужно умножение, в `perimeter` — сложение внутри скобок. Остальные строки не меняй."
    solution: |
      length = 7
      width = 4
      height = 3
      area = length * width
      perimeter = 2 * (length + width)
      volume = area * height
    explanation: "Умножение выполняется раньше сложения. Без скобок `2 * length + width` даёт 18 вместо 22. `volume` считается из уже исправленной `area`, поэтому его менять не нужно."
