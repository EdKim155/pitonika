id: m2.l3
module: m2
title: "Сравнения и логика"
goal: "Научиться сравнивать значения и соединять условия через and, or, not"
minutes: 9
order: 3
concepts: [comparison, logic]
steps:
  - id: m2.l3.s1
    type: theory
    title: "True или False"
    concepts: [comparison]
    body: |
      Ты уже встречал `==` в условиях. Сравнение — это выражение: оно вычисляется и даёт `True` или `False`, тип `bool`. Результат можно напечатать, сохранить в переменную или сразу передать в `if`. Сравнивать можно и переменные, и целые выражения.

      Операторы: `==` — равно, `!=` — не равно, `<` — меньше, `>` — больше, `<=` — меньше или равно, `>=` — больше или равно. Не путай `=` (присваивание) с `==` (сравнение) и `<=` с `<`: на границах ответ меняется. Python разрешает и цепочку: `10 <= x <= 20` означает оба ограничения сразу.

      Помни про типы: `"20"` и `20` — разные значения, строка сравнивается по алфавиту. Ввод из `input()` — всегда строка, поэтому перед сравнением с числом приводи его через `int()`.
    example: |
      age = 20
      print(age >= 18)   # True
      print(age == 18)   # False
    aside: "Одинарный знак = — присваивание, двойной == — сравнение."

  - id: m2.l3.s2
    type: theory
    title: "and, or, not"
    concepts: [logic]
    body: |
      Одно условие редко описывает всё. Логические операторы соединяют несколько сравнений.

      `and` истинен, только если истинны оба условия. `or` истинен, если истинно хотя бы одно. `not` переворачивает значение: истинное становится ложным.

      Приоритет такой: сначала `not`, потом `and`, потом `or`. Скобки меняют порядок, поэтому сложные условия лучше уточнять ими. Смысл скобок легко увидеть: `not (x > 0 and y > 0)` значит «не оба положительны», а `not x > 0 and y > 0` — совсем другое условие. Читай такие записи слева направо, но помни о приоритете.

      Фраза «число от 10 до 20» превращается в `x >= 10 and x <= 20`: оба ограничения обязательны. А `x < 10 or x > 20` описывает всё, что вне диапазона. Проверяй себя на границах — именно там чаще всего ошибаются.
    example: |
      x = 15
      print(x >= 10 and x <= 20)   # True
      print(x < 10 or x > 20)      # False
      print(not (x > 20))          # True

  - id: m2.l3.s3
    type: quiz
    title: "Выбери условие"
    concepts: [comparison, logic]
    question: "Какое условие истинно только для положительных чётных чисел?"
    options:
      - "x > 0 and x % 2 == 0"
      - "x > 0 or x % 2 == 0"
      - "not x < 0 and x % 2"
      - "x > 0 and x % 2"
      - "x >= 0 and x % 2 == 0"
    answers: [0]
    explanation: "Нужны оба признака одновременно, поэтому and. Через or подошли бы отрицательные чётные и положительные нечётные, а `x % 2` — это 0 или 1, а не проверка на равенство нулю."

  - id: m2.l3.s4
    type: blank
    title: "Собери условие"
    concepts: [comparison, logic]
    prompt: |
      Допиши операторы так, чтобы программа выводила «рабочий возраст» для чисел от 18 до 65 включительно. Для остальных не выводила ничего.
    template: |
      age = int(input())
      if age {{1}} 18 {{2}} age {{3}} 65:
          print("рабочий возраст")
    blanks:
      - answer: ">="
        hint: "Возраст не меньше 18"
      - answer: "and"
        hint: "Нужны оба ограничения сразу"
      - answer: "<="
        hint: "Возраст не больше 65"
    explanation: "Оба сравнения должны быть истинны одновременно, поэтому между ними `and`. В Python есть и короткая запись `18 <= age <= 65`, но здесь уже расставлены два отдельных сравнения."

  - id: m2.l3.s5
    type: code
    title: "Скидка в кино"
    concepts: [comparison, logic]
    prompt: |
      Программа читает два целых числа, каждое на своей строке: возраст и признак студента (`1` — студент, `0` — нет).

      Выведи `скидка`, если возраст меньше 18 **или** человек студент. Во всех остальных случаях выведи `полный`.
    mode: io
    starter: |
      age = int(input())
      is_student = int(input())
      # Проверь два условия через or
    fixtures:
      - stdin: |
          25
          1
        stdout: |
          скидка
      - stdin: |
          18
          0
        stdout: |
          полный
    hints:
      - "Прочитай оба числа через int(input()): сначала возраст, потом признак студента."
      - "Для скидки достаточно одного из двух условий: возраст меньше 18 или флаг, равный 1. Их соединяет or."
      - "Структура: два чтения, затем if с двумя сравнениями через or, а else выводит «полный»."
    solution: |
      age = int(input())
      is_student = int(input())
      if age < 18 or is_student == 1:
          print("скидка")
      else:
          print("полный")
    explanation: "or истинен, когда выполнено хотя бы одно условие: ребёнок или студент. Для 18 лет без студенческого обе части ложны, поэтому выводится «полный». Флаг можно проверить и короче — `if age < 18 or is_student:` — ведь 1 трактуется как True."

  - id: m2.l3.s6
    type: debug
    title: "Диапазон, который не работает"
    concepts: [comparison, logic]
    prompt: |
      Программа должна выводить `в диапазоне`, если число от 10 до 20 включительно, иначе `вне диапазона`. Сейчас она отвечает `в диапазоне` на любое число. Найди ошибку и исправь условие.
    mode: io
    broken: |
      x = int(input())
      if 10 <= x or x <= 20:
          print("в диапазоне")
      else:
          print("вне диапазона")
    fixtures:
      - stdin: "15"
        stdout: |
          в диапазоне
      - stdin: "5"
        stdout: |
          вне диапазона
    hints:
      - "Запусти программу на 5: какая из двух частей условия истинна?"
      - "Для диапазона нужны оба ограничения одновременно, а or пропускает, когда истинно хотя бы одно. При x = 5 вторая часть истинна, при x = 50 — первая."
      - "Структура: одно условие из двух сравнений, соединённых подходящим логическим оператором; else отвечает за все числа вне диапазона."
    solution: |
      x = int(input())
      if 10 <= x and x <= 20:
          print("в диапазоне")
      else:
          print("вне диапазона")
    explanation: "Диапазон задаётся пересечением: число должно быть не меньше 10 и не больше 20. С and условие истинно только внутри границ, включая 10 и 20."
