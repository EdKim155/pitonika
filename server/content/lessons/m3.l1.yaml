id: m3.l1
module: m3
title: "Цикл while"
goal: "Понять, как while повторяет блок, и научиться не попадать в бесконечный цикл"
minutes: 9
order: 1
concepts: [while, comparison]
steps:
  - id: m3.l1.s1
    type: theory
    title: "Повторение вместо копипаста"
    concepts: [while, comparison]
    body: |
      Чтобы вывести числа от 1 до 5, можно пять раз написать `print`. А если чисел сто или тысяча? На помощь приходит **цикл** — блок кода, который повторяется, пока выполняется условие.

      ```python
      number = 1
      while number <= 5:
          print(number)
          number += 1
      ```

      Читается так: «пока `number <= 5`, выполняй тело цикла». Условие проверяется **перед** каждой итерацией. Тело сдвинуто на 4 пробела: отступ показывает, какие строки относятся к циклу. Когда условие становится ложным, Python выходит из цикла и продолжает программу дальше.

      `number += 1` — короткая запись `number = number + 1`. Без этой строки счётчик не изменится, и условие останется истинным навсегда.
    example: |
      number = 1
      while number <= 3:
          print(number)
          number += 1
    aside: "Строка с while заканчивается двоеточием — как и строка с if."

  - id: m3.l1.s2
    type: quiz
    title: "Сколько итераций?"
    concepts: [while, comparison]
    question: "Сколько чисел выведет этот цикл?"
    code: |
      number = 0
      while number < 3:
          print(number)
          number += 1
    options:
      - "Ни одного"
      - "Три: 0, 1, 2"
      - "Четыре: 0, 1, 2, 3"
      - "Бесконечно"
    answers: [1]
    explanation: "Цикл идёт, пока number меньше 3: это 0, 1 и 2 — три итерации. Когда number станет 3, условие 3 < 3 ложно, и цикл остановится."

  - id: m3.l1.s3
    type: theory
    title: "Счётчик и бесконечный цикл"
    concepts: [while, accumulation]
    body: |
      В `while` почти всегда есть **счётчик** — переменная, которую меняют в теле цикла. Если её не менять, условие навсегда останется истинным:

      ```python
      number = 1
      while number <= 5:
          print(number)
          # забыли number += 1 — цикл не остановится
      ```

      Это **бесконечный цикл**: программа печатает одно и то же, пока её не прервут. В обычном терминале такой цикл останавливают сочетанием клавиш Ctrl+C. В тренажёре этого делать не нужно: он сам прервёт зависшую программу и подскажет, что случилось.

      Перед запуском цикла ответь на два вопроса:

      1. Что меняется в теле?
      2. Почему условие в итоге станет ложным?

      Счётчик не обязан расти ровно на 1: шаг может быть любым целым числом. Счётчик можно и уменьшать — например, отсчитывать от 3 до 1.
    example: |
      count = 3
      while count > 0:
          print(count)
          count -= 1
      print("Старт!")
    aside: "Если программа зависла, первым делом проверь переменную из условия: меняется ли она."

  - id: m3.l1.s4
    type: blank
    title: "Заполни пропуски"
    concepts: [while, comparison]
    prompt: "Допиши цикл, который выведет числа 1, 2 и 3 — каждое с новой строки."
    template: |
      number = 1
      while {{1}}:
          print(number)
          number += {{2}}
    blanks:
      - answer: "number <= 3"
        accept: ["number < 4", "number<=3", "number <=3", "number<= 3", "3 >= number"]
        hint: "Условие: пока number не больше 3"
      - answer: "1"
        hint: "На сколько растёт счётчик за шаг?"
    explanation: "Условие number <= 3 истинно для 1, 2 и 3, а на числе 4 становится ложным. Счётчик растёт на 1, поэтому цикл завершается и программа продолжает работу."

  - id: m3.l1.s5
    type: parsons
    title: "Собери обратный отсчёт"
    concepts: [while]
    prompt: "Собери программу: она отсчитывает от 3 до 1, а затем печатает «Старт!»."
    lines:
      - "    count -= 1"
      - 'print("Старт!")'
      - "while count > 0:"
      - "count = 3"
      - "    print(count)"
    solution:
      - "count = 3"
      - "while count > 0:"
      - "    print(count)"
      - "    count -= 1"
      - 'print("Старт!")'
    explanation: "Сначала заводим счётчик, потом пишем условие цикла. В теле сначала печатаем текущее значение, затем уменьшаем его. Последняя строка стоит без отступа — она выполнится один раз, после цикла."

  - id: m3.l1.s6
    type: code
    title: "Сумма от 1 до n"
    concepts: [while, accumulation]
    prompt: |
      Спроси у пользователя число `n` и посчитай сумму всех чисел от 1 до n включительно — с помощью `while`.

      Для `n = 5` сумма: `1 + 2 + 3 + 4 + 5 = 15`.
    mode: io
    starter: |
      n = int(input())
      # дальше твой код
    fixtures:
      - stdin: |
          5
        stdout: |
          15
      - stdin: |
          1
        stdout: |
          1
    hints:
      - "Заведи две переменные: счётчик (текущее число) и накопитель суммы."
      - "В теле цикла прибавляй счётчик к сумме, а затем увеличивай счётчик на 1."
      - "Структура: total = 0, number = 1; while number <= n: total += number, number += 1. Печать — после цикла."
    solution: |
      n = int(input())
      total = 0
      number = 1
      while number <= n:
          total += number
          number += 1
      print(total)
    explanation: "Цикл проходит числа от 1 до n и копит сумму в total. Для n = 1 условие истинно ровно один раз, поэтому ответ 1 — краевой случай тоже работает."

  - id: m3.l1.s7
    type: debug
    title: "Лишняя итерация"
    concepts: [while, comparison]
    prompt: |
      Программа должна вывести все числа от 1 до `n` включительно, но выводит на одно число больше. Найди ошибку и исправь её.

      Подсказка: граница в условии цикла взята на единицу больше нужной.
    mode: io
    broken: |
      n = int(input())
      number = 1
      while number <= n + 1:
          print(number)
          number += 1
    fixtures:
      - stdin: |
          3
        stdout: |
          1
          2
          3
      - stdin: |
          1
        stdout: |
          1
    hints:
      - "Сравни вывод программы с ожидаемым при n = 3. Какое число лишнее?"
      - "Лишнее — 4 при n = 3. Значит условие разрешает одну итерацию сверх нужного."
      - "Убери добавку из правой части условия: последняя итерация должна быть при number = n."
    solution: |
      n = int(input())
      number = 1
      while number <= n:
          print(number)
          number += 1
    explanation: "Условие number <= n + 1 пропускало число n + 1. Достаточно сравнивать прямо с n — и цикл остановится после последнего нужного числа. При n = 1 цикл выполнится ровно один раз."
