id: m0.l1
module: m0
title: "Первая программа"
goal: "Запустить первую программу и понять, как работает print()"
minutes: 7
order: 1
concepts: [print, string]
steps:
  - id: m0.l1.s1
    type: theory
    title: "Программа — это инструкции"
    concepts: [print]
    body: |
      Python выполняет инструкции сверху вниз, одну за другой.

      Самая простая инструкция — **вывод на экран**:

      ```python
      print("Привет!")
      ```

      Здесь `print` — имя команды, а `"Привет!"` — **строка**, текст в кавычках.
      Кавычки могут быть двойными `"` или одинарными `'` — главное, чтобы они совпадали.
    example: |
      print("Привет!")
      print('Как дела?')
    aside: "Скобки обязательны: print без скобок — уже другая история, и Python начнёт ругаться."

  - id: m0.l1.s2
    type: quiz
    title: "Что увидим на экране?"
    concepts: [print, string]
    question: "Что выведет эта программа?"
    code: |
      print("Python")
    options:
      - "Python"
      - "print"
      - "Ничего"
      - "Ошибка"
    answers: [0]
    explanation: "print выводит содержимое кавычек на экран. Само слово Python без кавычек было бы именем переменной."

  - id: m0.l1.s3
    type: predict
    title: "Две строки"
    concepts: [print]
    code: |
      print("Раз")
      print("Два")
    options:
      - "Раз Два"
      - "Раз\\nДва — на разных строках"
      - "Два, Раз"
      - "Ошибка"
    answer: 1
    explanation: "Каждый print начинает новую строку, поэтому «Раз» и «Два» окажутся на разных строках."

  - id: m0.l1.s4
    type: blank
    title: "Заполни пропуск"
    concepts: [print, string]
    prompt: "Допиши программу так, чтобы она вывела ровно: Python"
    template: |
      print({{1}})
    blanks:
      - answer: "\"Python\""
        accept: ["'Python'", "\"Python\""]
        hint: "Текст должен быть в кавычках"
    explanation: "Внутри print нужна строка — текст в кавычках. Без кавычек Python решил бы, что Python — это имя переменной."

  - id: m0.l1.s5
    type: theory
    title: "Ошибки — это нормально"
    concepts: [error_reading]
    body: |
      Ошибки — часть работы. Python не «сломался», он сообщает, что именно не понял.

      Например, если забыть кавычки:

      ```python
      print(Привет)
      ```

      Появится `NameError: name 'Привет' is not defined` — «имя не определено».
      Читай **последнюю строку** сообщения: там написано главное.
    example: |
      print("Всё хорошо")
    aside: "Профессионалы видят ошибки десятки раз в день. Это не провал, а подсказка."

  - id: m0.l1.s6
    type: code
    title: "Напиши сам"
    concepts: [print, string]
    prompt: |
      Напиши программу, которая выводит на экран ровно одну строку:

      ```
      Привет, мир!
      ```

      Нажми «Проверить», когда будешь готов.
    mode: io
    starter: |
      # Напиши код ниже
    fixtures:
      - stdin: ""
        stdout: |
          Привет, мир!
    hints:
      - "Нужна всего одна команда print и текст в кавычках."
      - "Проверь, что кавычки парные и что внутри них ровно «Привет, мир!»."
      - "Структура: print(\"…\"). Восклицательный знак и запятая — часть текста."
    solution: |
      print("Привет, мир!")
    explanation: "print выводит строку и добавляет перевод строки. Совпадение должно быть точным, включая запятую и восклицательный знак."

  - id: m0.l1.s7
    type: code
    title: "Две строки"
    concepts: [print, string]
    prompt: |
      Выведи две строки:

      ```
      Первая строка
      Вторая строка
      ```
    mode: io
    starter: ""
    fixtures:
      - stdin: ""
        stdout: |
          Первая строка
          Вторая строка
    hints:
      - "Один print выводит одну строку."
      - "Значит, нужно два вызова print — по одному на строку."
      - "Порядок важен: сначала «Первая строка», потом «Вторая строка»."
    solution: |
      print("Первая строка")
      print("Вторая строка")
    explanation: "Каждый print завершает строку. Два вызова — две строки в нужном порядке."
