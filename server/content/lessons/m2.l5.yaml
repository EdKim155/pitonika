id: m2.l5
module: m2
title: "Босс: определитель числа"
goal: "Собрать всё вместе: определять знак, чётность, кратность и сортировать числа"
minutes: 10
order: 5
concepts: [if, comparison, logic, nesting]
steps:
  - id: m2.l5.s1
    type: theory
    title: "Разбираем число по признакам"
    concepts: [if, comparison]
    body: |
      Определить число — значит ответить на несколько вопросов: какое оно по знаку, чётное или нечётное, делится ли на что-то ещё.

      Для чётности и кратности нужен остаток `%`. Число чётное, если `n % 2 == 0`. Кратно трём — если `n % 3 == 0`. Остаток от деления на 2 всегда 0 или 1, и для отрицательных чисел Python тоже даёт неотрицательный остаток: `-7 % 2` равно 1, а не минус единице. Ноль формально чётный, но знака у него нет.

      Порядок проверок важен. Ноль не положительный и не отрицательный, поэтому его проверяют первым. Дальше проверяют знак, потом чётность. Так цепочка `if` / `elif` выдаёт ровно один ответ и не путает ветки.
    example: |
      n = 12
      if n % 2 == 0:
          print("чётное")
      if n % 3 == 0:
          print("кратно трём")

  - id: m2.l5.s2
    type: theory
    title: "Сортировка двух и трёх чисел"
    concepts: [comparison, if]
    body: |
      Чтобы упорядочить два числа, достаточно сравнить их и при необходимости поменять местами. `a, b = b, a` — обмен значений в одну строку: Python сначала вычисляет правую часть, а потом присваивает результаты переменным. Работает это и с числами, и со строками.

      Для трёх чисел сравниваем так: сначала `a` и `b`, потом `a` и `c`, потом `b` и `c`. После первой проверки `a` — меньшее из первой пары. После второй `a` — самое маленькое из всех. Третья ставит на место `b` и `c`.

      После этих трёх проверок числа идут по возрастанию. Главное — не запутаться, какие переменные уже стоят на своих местах. Если числа равны, обмен не нужен, и порядок не изменится. Такой способ называют сортировкой обменом.
    example: |
      a = 7
      b = 3
      if a > b:
          a, b = b, a
      print(a, b)   # 3 7

  - id: m2.l5.s3
    type: quiz
    title: "Что выведет цепочка?"
    concepts: [if, logic]
    question: "Что напечатает программа для n = -6?"
    code: |
      n = -6
      if n == 0:
          print("ноль")
      elif n < 0 and n % 2 == 0:
          print("отрицательное чётное")
      elif n < 0:
          print("отрицательное нечётное")
      else:
          print("положительное")
    options:
      - "ноль"
      - "отрицательное чётное"
      - "отрицательное нечётное"
      - "положительное"
      - "Ошибка"
    answers: [1]
    explanation: "Ноль не подходит, первая проверка ложна. Во второй ветке оба условия истинны: -6 меньше нуля и остаток от деления на 2 равен нулю. Цепочка на этом заканчивается, третья ветка уже не проверяется."

  - id: m2.l5.s4
    type: blank
    title: "Остатки и признаки"
    concepts: [comparison]
    prompt: |
      Допиши операторы сравнения: программа должна вывести «нечётное» для чисел, которые не делятся на 2, и «делится на 5» для чисел, кратных пяти.
    template: |
      n = int(input())
      if n % 2 {{1}} 0:
          print("нечётное")
      if n % 5 {{2}} 0:
          print("делится на 5")
    blanks:
      - answer: "!="
        hint: "Нечётное — значит остаток не равен нулю"
      - answer: "=="
        hint: "Кратное — значит остаток равен нулю"
    explanation: "`%` возвращает остаток от деления. Нечётное число даёт остаток 1, поэтому проверка `n % 2 != 0`. Кратность пяти означает остаток 0: `n % 5 == 0`. Второй if независимый, поэтому кратные пяти могут вывести обе строки."

  - id: m2.l5.s5
    type: parsons
    title: "Собери определитель"
    concepts: [if, nesting]
    prompt: |
      Собери программу, которая по числу выводит «ноль», «отрицательное», «положительное чётное» или «положительное нечётное».

      В наборе есть лишние строки. Подумай, почему проверка на ноль должна идти первой.
    lines:
      - "elif n % 2 == 0:"
      - '    print("положительное")'
      - "if n == 0:"
      - "elif n < 0:"
      - '    print("отрицательное")'
      - "n = int(input())"
      - "elif n > 0:"
      - '    print("положительное нечётное")'
      - "if n < 0:"
      - '    print("ноль")'
      - "else:"
      - '    print("положительное чётное")'
    solution:
      - "n = int(input())"
      - "if n == 0:"
      - '    print("ноль")'
      - "elif n < 0:"
      - '    print("отрицательное")'
      - "elif n % 2 == 0:"
      - '    print("положительное чётное")'
      - "else:"
      - '    print("положительное нечётное")'
    explanation: "Без первой проверки ноль попал бы в ветку `elif n % 2 == 0` и получил бы ответ «положительное чётное», что неверно. После нуля и отрицательных остаются только положительные: чётные ловит elif с остатком 0, нечётные — else."

  - id: m2.l5.s6
    type: code
    title: "Три числа по возрастанию"
    concepts: [comparison, if]
    prompt: |
      Программа читает три целых числа, каждое на своей строке, и выводит их по возрастанию через пробел.

      Используй сравнения и обмен значений. Не применяй `sorted`, `min` и `max` — смысл задания в том, чтобы расставить числа самому.
    mode: io
    starter: |
      a = int(input())
      b = int(input())
      c = int(input())
      # Расставь числа по возрастанию
    fixtures:
      - stdin: |
          3
          1
          2
        stdout: |
          1 2 3
      - stdin: |
          5
          5
          1
        stdout: |
          1 5 5
    hints:
      - "Сравни a и b: если a больше, поменяй их местами. После этого a — меньшее из первых двух."
      - "Теперь сравни a и c: если a больше, обменяй их. После этого на месте a стоит самое маленькое число из трёх."
      - "Осталось упорядочить b и c: если b больше c, поменяй их. Структура: три независимых if с обменом вида x, y = y, x, затем print с тремя значениями через пробел."
    solution: |
      a = int(input())
      b = int(input())
      c = int(input())
      if a > b:
          a, b = b, a
      if a > c:
          a, c = c, a
      if b > c:
          b, c = c, b
      print(a, b, c)
    explanation: "После первого обмена a не больше b. После второго a не больше c, значит a — минимум. Остаётся навести порядок в паре b и c. Равные числа не меняются местами, поэтому дубликаты сохраняются."

  - id: m2.l5.s7
    type: debug
    title: "Ноль выпал из проверок"
    concepts: [if, nesting]
    prompt: |
      Программа должна выводить:

      - `ноль` — для нуля;
      - иначе две строки: знак (`положительное` или `отрицательное`) и чётность (`чётное` или `нечётное`).

      Сейчас на нуле ответ неверный, а на остальных числах всё в порядке. Найди причину и исправь программу.
    mode: io
    broken: |
      n = int(input())
      if n > 0:
          print("положительное")
      elif n < 0:
          print("отрицательное")
      if n % 2 == 0:
          print("чётное")
      else:
          print("нечётное")
    fixtures:
      - stdin: "0"
        stdout: |
          ноль
      - stdin: "-7"
        stdout: |
          отрицательное
          нечётное
    hints:
      - "Проверь на нуле: какую строку выводит программа и какую должна?"
      - "Ноль не попадает ни в n > 0, ни в n < 0, но проверка чётности для него всё равно выполняется. Отдельная ветка для нуля должна идти первой."
      - "Структура: сначала if на ноль с else, внутри else — определение знака, а после него — проверка чётности. Либо сделай всю цепочку через elif, где ноль стоит первым."
    solution: |
      n = int(input())
      if n == 0:
          print("ноль")
      else:
          if n > 0:
              print("положительное")
          else:
              print("отрицательное")
          if n % 2 == 0:
              print("чётное")
          else:
              print("нечётное")
    explanation: "У нуля нет знака, поэтому его обрабатывают отдельно и первым. Остальные числа получают строку знака и строку чётности. Если оставить проверку чётности общей, ноль ошибочно считается чётным без строки «ноль»."
