id: m3.l6
module: m3
title: "Босс: циклы"
goal: "Соединить накопление, цифры и вложенные циклы в одной программе"
minutes: 10
order: 6
concepts: [nested_loops, accumulation, digits]
steps:
  - id: m3.l6.s1
    type: theory
    title: "Три приёма вместе"
    concepts: [accumulation, digits]
    body: |
      В этом уроке встречаются все приёмы модуля: копилка, разбор цифр и вложенные циклы.

      Копилка собирает результат, который нужен после цикла: сумму, количество или максимум. Разбор цифр через `% 10` и `// 10` позволяет заглянуть внутрь каждого числа. А вложенный цикл нужен, когда для каждого шага внешнего цикла надо сделать несколько шагов внутреннего.

      Например, посчитаем сумму всех цифр чисел от 1 до 5:

      ```python
      total = 0
      for number in range(1, 6):
          while number > 0:
              total += number % 10
              number //= 10
      print(total)  # 15
      ```

      Внешний цикл перебирает числа, внутренний разбирает каждое на цифры.
    example: |
      total = 0
      for number in range(1, 6):
          while number > 0:
              total += number % 10
              number //= 10
      print(total)
    aside: "Внутренний while меняет копию числа из range; сам range от этого не ломается."

  - id: m3.l6.s2
    type: theory
    title: "Цикл внутри цикла"
    concepts: [nested_loops, for, range]
    body: |
      Вложенный цикл — это цикл внутри другого цикла. На каждую итерацию внешнего цикла внутренний выполняется целиком.

      ```python
      for i in range(1, 4):
          for j in range(1, 4):
              print(i * j, end=" ")
          print()
      ```

      Здесь внешний цикл выбирает строку, внутренний — столбец. `end=" "` печатает числа в одной строке, а пустой `print()` после внутреннего цикла заканчивает строку.

      Так получается таблица умножения. Всего будет девять произведений: три строки по три столбца. Если строк или столбцов больше, меняется только граница `range`.

      Отступы показывают, какой цикл вложен: тело внутреннего цикла сдвинуто на два уровня.
    example: |
      for i in range(1, 4):
          for j in range(1, 4):
              print(i * j, end=" ")
          print()
    aside: "Внутренний цикл запускается заново на каждом шаге внешнего."

  - id: m3.l6.s3
    type: predict
    title: "Двойная копилка"
    concepts: [nested_loops, accumulation, range]
    code: |
      total = 0
      for i in range(1, 4):
          for j in range(1, 4):
              total += i * j
      print(total)
    options:
      - "36"
      - "18"
      - "9"
      - "6"
    answer: 0
    explanation: "Сумма произведений равна (1 + 2 + 3) × (1 + 2 + 3) = 6 × 6 = 36. Внутренний цикл успевает выполниться девять раз."

  - id: m3.l6.s4
    type: parsons
    title: "Собери треугольник"
    concepts: [nested_loops, for]
    prompt: |
      Собери программу, которая читает число `n` и выводит треугольник из звёзд высотой `n`.

      Для `n = 4` должно получиться:

      ```
      *
      **
      ***
      ****
      ```

      Одна строка в наборе — лишняя.
    lines:
      - '    print("*" * i)'
      - "n = int(input())"
      - '    print("*" * n)'
      - "for i in range(1, n + 1):"
    solution:
      - "n = int(input())"
      - "for i in range(1, n + 1):"
      - '    print("*" * i)'
    explanation: "Сначала читаем n, затем перебираем номера строк от 1 до n. На строке i печатаем i звёзд: print(\"*\" * i). Лишняя строка печатала бы n звёзд в каждой строке — получился бы квадрат."

  - id: m3.l6.s5
    type: code
    title: "Простые числа до N"
    concepts: [nested_loops, for, range]
    prompt: |
      Вводится натуральное число `N`. Выведи все простые числа от 2 до `N` включительно, каждое на новой строке.

      Простое число делится без остатка только на 1 и на само себя.
      Для `N = 10` ответ:

      ```
      2
      3
      5
      7
      ```

      Если простых чисел в диапазоне нет, не выводи ничего.
    mode: io
    starter: |
      n = int(input())
      for number in range(2, n + 1):
          # проверь, простое ли number
          ...
    fixtures:
      - stdin: |
          10
        stdout: |
          2
          3
          5
          7
      - stdin: |
          1
        stdout: ""
    hints:
      - "Каждое число от 2 до N нужно проверить отдельно: внешний цикл идёт по number, а делители перебирает внутренний."
      - "Число простое, если ни один делитель от 2 до number - 1 не делит его без остатка. Флажок is_prime запоминает результат проверки."
      - "До внутреннего цикла поставь is_prime = True; при найденном делителе сделай False и break; после внутреннего цикла выведи number, только если флажок остался True."
    solution: |
      n = int(input())
      for number in range(2, n + 1):
          is_prime = True
          for divisor in range(2, number):
              if number % divisor == 0:
                  is_prime = False
                  break
          if is_prime:
              print(number)
    explanation: "Внешний цикл перебирает кандидатов, внутренний проверяет делители. break досрочно прекращает проверку, как только делитель найден. Число 2 проходит проверку сразу: диапазон делителей для него пуст."

  - id: m3.l6.s6
    type: debug
    title: "Таблица обрезалась"
    concepts: [nested_loops, for, range]
    prompt: |
      Программа должна вывести таблицу умножения от 1 до `n`: `n` строк, в каждой — `n` чисел через пробел.

      Для `n = 3` ожидается:

      ```
      1 2 3
      2 4 6
      3 6 9
      ```

      Сейчас первая строка короче второй, а вторая — короче третьей. Исправь границу внутреннего цикла.
    mode: io
    broken: |
      n = int(input())
      for i in range(1, n + 1):
          for j in range(1, i + 1):
              print(i * j, end=" ")
          print()
    fixtures:
      - stdin: |
          3
        stdout: |
          1 2 3
          2 4 6
          3 6 9
      - stdin: |
          1
        stdout: |
          1
    hints:
      - "Сравни количество чисел в строках: в первой — одно, во второй — два, а должно быть по n в каждой."
      - "Граница внутреннего цикла зависит от номера строки, но должна зависеть от n."
      - "Оставь внешний цикл без изменений, а внутренний должен пройти от 1 до n включительно."
    solution: |
      n = int(input())
      for i in range(1, n + 1):
          for j in range(1, n + 1):
              print(i * j, end=" ")
          print()
    explanation: "Внутренний цикл был ограничен номером строки i, поэтому строки получались разной длины. Таблица n × n требует n столбцов в каждой строке."
