id: m3.l4
module: m3
title: "Накопление: сумма и счётчик"
goal: "Собирать сумму, количество и максимум по ходу цикла"
minutes: 9
order: 4
concepts: [accumulation, for, range]
steps:
  - id: m3.l4.s1
    type: theory
    title: "Переменная-копилка"
    concepts: [accumulation, for]
    body: |
      Часто нужно не просто повторить действие, а **собрать результат по кусочкам**: сложить числа, посчитать, сколько их, найти самое большое.

      Для этого заводим переменную до цикла и меняем её на каждом шаге. Сумму начинают с нуля:

      ```python
      total = 0
      for number in range(1, 4):
          total += number
      ```

      Запись `+=` значит «прибавить к текущему значению». После цикла в `total` окажется `1 + 2 + 3 = 6`.

      Счётчик — та же копилка, только к ней всегда прибавляют единицу: `count += 1`. Начальное значение задаётся **до** цикла, иначе копилка будет обнуляться на каждой итерации.
    example: |
      count = 0
      for number in range(1, 6):
          if number % 2 == 0:
              count += 1
      print(count)  # 2
    aside: "Накопление — это шаблон: начальное значение до цикла, обновление внутри, использование после."

  - id: m3.l4.s2
    type: theory
    title: "Максимум и среднее"
    concepts: [accumulation, for]
    body: |
      Максимум ищут так: берут первое число как «пока максимум» и сравнивают с ним остальные.

      ```python
      maximum = int(input())
      for _ in range(3):
          number = int(input())
          if number > maximum:
              maximum = number
      ```

      Если начать максимум с нуля, все отрицательные числа останутся незамеченными, и ответ будет неверным.

      Среднее — это сумма, делённая на количество. В Python оператор `/` всегда даёт `float`: `15 / 3` — это `5.0`, а не `5`. Поэтому среднее удобно считать после цикла, когда уже известны и сумма, и количество чисел.
    example: |
      total = 10
      count = 4
      print(total / count)  # 2.5
    aside: "Целое деление // и остаток % пригодятся в следующем уроке."

  - id: m3.l4.s3
    type: predict
    title: "Что накопит цикл"
    concepts: [accumulation, range]
    code: |
      total = 0
      for number in range(1, 6):
          total += number
      print(total)
    options:
      - "10"
      - "15"
      - "6"
      - "5"
    answer: 1
    explanation: "range(1, 6) даёт числа 1, 2, 3, 4, 5. Их сумма равна 15; число 6 в диапазон не входит."

  - id: m3.l4.s4
    type: blank
    title: "Собери сумму"
    concepts: [accumulation, for]
    prompt: |
      Программа должна вывести сумму чётных чисел от 1 до 10:
      `2 + 4 + 6 + 8 + 10 = 30`.
      Заполни пропуск.
    template: |
      total = 0
      for number in range(1, 11):
          if number % 2 == 0:
              total {{1}} number
      print(total)
    blanks:
      - answer: "+="
        hint: "Нужен оператор, который прибавляет к текущему значению"
    explanation: "total += number равносильно total = total + number. В копилку попадают только чётные числа, поэтому после цикла в ней 30."

  - id: m3.l4.s5
    type: code
    title: "Сумма и среднее"
    concepts: [accumulation, for, range]
    prompt: |
      Сначала вводится количество чисел `n` (положительное), затем сами числа — по одному в строке.

      Выведи сумму всех чисел, а на следующей строке — их среднее.
      Среднее выводи как обычное число Python: для `4`, `5` и `6` это `5.0`.

      Для ввода

      ```
      3
      4
      5
      6
      ```

      вывод должен быть

      ```
      15
      5.0
      ```
    mode: io
    starter: |
      n = int(input())
      # ...
    fixtures:
      - stdin: |
          3
          4
          5
          6
        stdout: |
          15
          5.0
      - stdin: |
          1
          7
        stdout: |
          7
          7.0
    hints:
      - "Копилку total заведи до цикла и обнули."
      - "Внутри цикла читай очередное число и прибавляй его к сумме, а не заменяй сумму."
      - "После цикла понадобятся два print: сумма и total / n — деление должно быть обычным, не целочисленным."
    solution: |
      n = int(input())
      total = 0
      for _ in range(n):
          total += int(input())
      print(total)
      print(total / n)
    explanation: "Сумма накапливается в total, а среднее получается делением суммы на n уже после цикла. Поэтому 15 / 3 даёт 5.0 — это float, а не int."

  - id: m3.l4.s6
    type: debug
    title: "Максимум не работает"
    concepts: [accumulation]
    prompt: |
      Программа должна находить наибольшее из введённых чисел. Сначала вводится количество чисел `n`, затем сами числа.

      Для чисел `9`, `2` и `5` она случайно выдаёт правильный ответ `9`. А на числах `-5`, `-3` и `-8` ошибается.

      Найди ошибку и исправь её.
    mode: io
    broken: |
      n = int(input())
      maximum = 0
      for _ in range(n):
          number = int(input())
          if number > maximum:
              maximum = number
      print(maximum)
    fixtures:
      - stdin: |
          3
          9
          2
          5
        stdout: |
          9
      - stdin: |
          3
          -5
          -3
          -8
        stdout: |
          -3
    hints:
      - "Запусти программу на втором примере и посмотри, что окажется в максимуме."
      - "Ноль больше любого отрицательного числа, поэтому maximum = 0 никогда не обновится."
      - "Возьми первое число как начальный максимум, а цикл запусти на n - 1 повтор."
    solution: |
      n = int(input())
      maximum = int(input())
      for _ in range(n - 1):
          number = int(input())
          if number > maximum:
              maximum = number
      print(maximum)
    explanation: "Максимум нельзя начинать с нуля: для отрицательных чисел ноль окажется «больше» всех. Правильно считать первое число частью ответа и сравнивать остальные с ним."
