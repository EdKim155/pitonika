id: m2.l2
module: m2
title: "elif и цепочки условий"
goal: "Разобраться с elif, порядком проверок и выбором одного варианта из нескольких"
minutes: 8
order: 2
concepts: [if]
steps:
  - id: m2.l2.s1
    type: theory
    title: "Когда вариантов больше двух"
    concepts: [if]
    body: |
      `if` и `else` делят мир на две части: подошло — не подошло. Но вариантов часто больше: оценки, возрастные категории, уровни доступа.

      Для этого есть `elif` — сокращение от else if. Каждая ветка `elif` имеет своё условие и проверяется, только если все предыдущие оказались ложными. Python идёт сверху вниз и выполняет первую истинную ветку. Как только одна сработала, остальные пропускаются — даже если их условия тоже истинны.

      ```python
      score = 85
      if score >= 90:
          print("отлично")
      elif score >= 75:
          print("хорошо")
      else:
          print("надо подтянуть")
      ```

      В примере 85 не проходит первую проверку, проходит вторую — и на этом цепочка заканчивается. `else` ставится последним и условия не имеет: он ловит всё, что осталось. Веток `elif` может быть сколько угодно, а `else` необязателен: без него программа просто ничего не сделает, если ни одно условие не подошло.
    example: |
      color = "жёлтый"
      if color == "красный":
          print("стой")
      elif color == "жёлтый":
          print("приготовься")
      else:
          print("иди")
    aside: "elif — не отдельный оператор, а продолжение той же цепочки, начатой if."

  - id: m2.l2.s2
    type: theory
    title: "Порядок проверок решает"
    concepts: [if]
    body: |
      Цепочка `elif` работает только при правильном порядке. Условия проверяются по очереди, поэтому ставь более узкие и строгие варианты выше, а широкие — ниже.

      Вот та же логика, что в прошлом шаге, но проверки переставлены. Ветка `score >= 90` здесь недостижима: всё, что больше или равно 90, уже поймала первая проверка `score >= 75`. Программа не сломается, но «отлично» никто не увидит.

      ```python
      score = 96
      if score >= 75:
          print("хорошо")
      elif score >= 90:
          print("отлично")
      ```

      Правило простое: от частного к общему. Если варианты пересекаются, сначала отсекай более редкий и конкретный случай. Когда одно значение подходит под несколько условий, выиграет то, что стоит выше, поэтому пересекающиеся проверки требуют особого внимания. `else` в конце — страховка для всех оставшихся значений, и ему условие не нужно.
    example: |
      score = 96
      if score >= 90:
          print("отлично")
      elif score >= 75:
          print("хорошо")

  - id: m2.l2.s3
    type: predict
    title: "Какая ветка сработает?"
    concepts: [if]
    code: |
      points = 72
      if points >= 90:
          print("уровень 3")
      elif points >= 70:
          print("уровень 2")
      elif points >= 50:
          print("уровень 1")
      else:
          print("уровень 0")
    options:
      - "уровень 3"
      - "уровень 2"
      - "уровень 1"
      - "уровень 2 и уровень 1"
      - "Ошибка"
    answer: 1
    explanation: "Python выполняет первую истинную ветку и выходит из цепочки. 72 не проходит проверку 90, но проходит 70 — печатается «уровень 2», а elif с 50 уже не проверяется."

  - id: m2.l2.s4
    type: parsons
    title: "Собери определитель яблок"
    concepts: [if]
    prompt: |
      Собери программу: она читает число яблок и выводит «мало» (меньше 3), «норма» (от 3 до 5 включительно) или «много» (больше 5).

      В наборе есть лишние строки — выбирай только нужные.
    lines:
      - "elif apples <= 5:"
      - "else:"
      - '    print("много")'
      - "apples = int(input())"
      - '    print("мало")'
      - "if apples < 3:"
      - '    print("норма")'
      - "if apples <= 5:"
    solution:
      - "apples = int(input())"
      - "if apples < 3:"
      - '    print("мало")'
      - "elif apples <= 5:"
      - '    print("норма")'
      - "else:"
      - '    print("много")'
    explanation: "После проверки «меньше 3» остались значения от 3 и больше. Из них до 5 включительно — это «норма», всё остальное — «много». Поэтому достаточно верхней границы: нижнюю уже отсеяла первая ветка."

  - id: m2.l2.s5
    type: code
    title: "Вердикт по температуре"
    concepts: [if]
    prompt: |
      Программа читает температуру — целое число — и выводит ровно одно слово:

      - ниже 0 — `мороз`
      - от 0 до 14 включительно — `прохладно`
      - от 15 до 25 включительно — `тепло`
      - выше 25 — `жарко`

      Проверки должны идти цепочкой, чтобы срабатывала только одна ветка.
    mode: io
    starter: |
      # Прочитай температуру и выведи вердикт
    fixtures:
      - stdin: "22"
        stdout: |
          тепло
      - stdin: "0"
        stdout: |
          прохладно
    hints:
      - "Сначала получи число: input() возвращает строку, поэтому нужен int()."
      - "Нижнюю границу можно не проверять повторно: если отрицательные уже отсечены предыдущей веткой, дальше достаточно `elif temp <= 14`."
      - "Структура: `if` для мороза, три `elif` с границами по возрастанию и `else` для жары; в каждой ветке один print с отступом 4 пробела."
    solution: |
      temp = int(input())
      if temp < 0:
          print("мороз")
      elif temp <= 14:
          print("прохладно")
      elif temp <= 25:
          print("тепло")
      else:
          print("жарко")
    explanation: "Цепочка идёт от меньших значений к большим. Ветка `elif temp <= 14` срабатывает только для тех, кто не попал в мороз, поэтому нижнюю границу писать не нужно. При температуре 0 работает «прохладно»."

  - id: m2.l2.s6
    type: debug
    title: "Лишняя строка в ответе"
    concepts: [if]
    prompt: |
      Программа должна выводить ровно один вердикт по баллам:

      - 90 и больше — `отлично`
      - от 75 до 89 — `хорошо`
      - меньше 75 — `надо подтянуть`

      Но на 95 она выдаёт две строки. Найди ошибку и исправь её.
    mode: io
    broken: |
      grade = int(input())
      if grade >= 90:
          print("отлично")
      if grade >= 75:
          print("хорошо")
      else:
          print("надо подтянуть")
    fixtures:
      - stdin: "95"
        stdout: |
          отлично
      - stdin: "74"
        stdout: |
          надо подтянуть
    hints:
      - "Запусти программу на 95 и посчитай, сколько строк она выведет."
      - "Второй `if` проверяется всегда, даже когда первый уже сработал. Для взаимоисключающих вариантов нужна цепочка с elif."
      - "Структура: один `if` для отличников, `elif` для остальных сильных и `else` для всех оставшихся; отступы у всех print одинаковые."
    solution: |
      grade = int(input())
      if grade >= 90:
          print("отлично")
      elif grade >= 75:
          print("хорошо")
      else:
          print("надо подтянуть")
    explanation: "Отдельные if проверяются независимо: для 95 второй тоже истинен. elif входит в ту же цепочку и проверяется только после ложного первого условия, поэтому выводится ровно одна строка."
