id: m1.l5
module: m1
title: "Босс: калькулятор времени"
goal: "Собрать программу с вводом, f-строками и форматированием времени"
minutes: 10
order: 5
concepts: [input, int, fstring, type_conversion, operators]
steps:
  - id: m1.l5.s1
    type: theory
    title: "Имя и возраст с клавиатуры"
    concepts: [input, type_conversion]
    body: |
      Ввод с клавиатуры делает программу универсальной: она может поздороваться с любым именем и посчитать возраст. Строку читают через `input()`, а число — через `int(input())`. Если забыть про `int()`, в переменной останется текст, и арифметика не сработает.

      Например, имя сохраняют так: `name = input()`. Возраст: `age = int(input())`. В скобках можно написать приглашение, но тогда этот текст тоже попадёт в вывод. В задачах с точным ответом лучше вызывать `input()` без аргументов.

      Каждый вызов `input()` читает одну строку. Если нужно два значения, вызови функцию дважды. Сначала реши, какие данные нужны программе, и только потом расставь вызовы в нужном порядке.
    example: |
      name = input()
      age = int(input())
      print("Привет, " + name + "!")
      print("Через год тебе будет", age + 1)
    aside: "Порядок ввода важен: программа читает строки в том порядке, в каком идут вызовы input()."

  - id: m1.l5.s2
    type: theory
    title: "f-строки и формат 02d"
    concepts: [fstring]
    body: |
      f-строка начинается с буквы `f` перед кавычками. Внутри неё в фигурных скобках можно вставлять значения переменных: `f"Привет, {name}!"`. Python подставит содержимое переменной вместо `{name}`.

      В фигурных скобках могут быть не только имена, но и выражения: например, `{age + 1}`. Python сначала вычислит результат, а затем вставит его в текст.

      Внутри скобок можно форматировать число. Запись `{hours:02d}` означает: вывести целое число, дополнив его нулём до двух цифр. Так `9` превратится в `09`, а `5` — в `05`. Буква `d` означает целое число, `2` — ширину поля, `0` — символ заполнения. Форматирование не меняет само число — оно влияет только на то, как значение выглядит в строке.

      Это удобно для времени: `f"{h:02d}:{m:02d}"` даёт `09:05` вместо `9:5`. Формат `02d` работает только с целыми числами.
    example: |
      h = 9
      m = 5
      print(f"{h:02d}:{m:02d}")
    aside: "Без буквы f фигурные скобки останутся обычным текстом, и подстановки не будет."

  - id: m1.l5.s3
    type: predict
    title: "Что покажут часы?"
    concepts: [fstring]
    code: |
      hours = 9
      minutes = 5
      print(f"{hours:02d}:{minutes:02d}")
    options:
      - "9:5"
      - "09:05"
      - "09:5"
      - "Ошибка"
    answer: 1
    explanation: "Формат 02d дополняет каждое число нулём до двух цифр, поэтому 9 превращается в 09, а 5 — в 05."

  - id: m1.l5.s4
    type: parsons
    title: "Собери приветствие"
    concepts: [input, fstring, type_conversion]
    prompt: |
      Собери программу, которая читает имя и возраст и выводит две строки:

      ```
      Привет, Аня!
      Через год тебе будет 13.
      ```

      Имя вводится первой строкой, возраст — второй. Некоторые строки лишние: их не нужно использовать.
    lines:
      - 'age = int(input())'
      - 'print("Привет, name!")'
      - 'name = input()'
      - 'print(f"Через год тебе будет {age + 1}.")'
      - 'age = input()'
      - 'print(f"Привет, {name}!")'
      - 'print(f"Через год тебе будет {age}.")'
    solution:
      - 'name = input()'
      - 'age = int(input())'
      - 'print(f"Привет, {name}!")'
      - 'print(f"Через год тебе будет {age + 1}.")'
    explanation: "Сначала читаем имя строкой, затем возраст целым числом. В f-строке {name} подставляет имя, а {age + 1} сразу вычисляет возраст через год."

  - id: m1.l5.s5
    type: code
    title: "Приветствие и возраст"
    concepts: [input, int, fstring]
    prompt: |
      Напиши программу, которая спрашивает имя и возраст и выводит две строки:

      ```
      Привет, <имя>!
      Через год тебе будет <возраст + 1>.
      ```

      Имя вводится первой строкой, возраст — второй. Возраст — целое число.
    mode: io
    starter: |
      # Прочитай имя и возраст, затем выведи две строки
    fixtures:
      - stdin: |
          Аня
          12
        stdout: |
          Привет, Аня!
          Через год тебе будет 13.
      - stdin: |
          Макс
          0
        stdout: |
          Привет, Макс!
          Через год тебе будет 1.
    hints:
      - "Имя читается строкой, а возраст — числом: для возраста понадобится int()."
      - "Возраст через год — это age + 1. Подставь значение в f-строку, а не склеивай строки вручную."
      - "Структура: прочитай имя и возраст, затем два print с f-строками."
    solution: |
      name = input()
      age = int(input())
      print(f"Привет, {name}!")
      print(f"Через год тебе будет {age + 1}.")
    explanation: "name остаётся строкой, age становится числом благодаря int(). В f-строках значения подставляются автоматически, а {age + 1} вычисляется до вывода."

  - id: m1.l5.s6
    type: code
    title: "Калькулятор времени"
    concepts: [int, fstring, operators]
    prompt: |
      Это калькулятор времени. Программа получает число минут, прошедших с начала суток, и выводит время в формате `ЧЧ:ММ`.

      Например, `545` минут — это `09:05`, а `5` минут — это `00:05`. Часы и минуты должны быть двузначными.
    mode: io
    starter: |
      # Прочитай минуты и переведи их в часы и минуты
    fixtures:
      - stdin: |
          545
        stdout: |
          09:05
      - stdin: |
          5
        stdout: |
          00:05
    hints:
      - "input() возвращает строку; чтобы делить на 60, преврати её в число через int()."
      - "Часы — это целая часть от деления на 60, минуты — остаток от деления на 60."
      - "Структура: получи total, вычисли h через // и m через %, выведи f-строку с :02d у обоих чисел."
    solution: |
      total = int(input())
      h = total // 60
      m = total % 60
      print(f"{h:02d}:{m:02d}")
    explanation: "В одном часе 60 минут. Оператор // даёт целые часы, а % — оставшиеся минуты. Формат 02d добавляет ведущие нули, чтобы получилось 09:05, а не 9:5."
