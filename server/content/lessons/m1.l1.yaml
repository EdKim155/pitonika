id: m1.l1
module: m1
title: "Переменные и присваивание"
goal: "Научиться сохранять значения в переменные и понимать, как присваивание меняет их"
minutes: 8
order: 1
concepts: [variables, naming, string, int]
steps:
  - id: m1.l1.s1
    type: theory
    title: "Значение получает имя"
    concepts: [variables, string]
    body: |
      Переменная — это имя, под которым Python хранит значение. Присваивание записывают знаком `=`: слева имя, справа значение. Например, `city = "Казань"` кладёт строку в переменную `city`, а `print(city)` выводит её на экран. Здесь `print` — команда, а не имя переменной. Имя придумываешь ты сам, и по нему потом обращаешься к значению. Пока переменная не создана, обращение к её имени вызовет ошибку `NameError`. Не путай `=` со сравнением: это не «равно», а «положи значение». Одна и та же переменная может хранить разные значения: новая строка с `=` заменяет старую. Прежнее значение нигде не сохраняется, поэтому порядок строк в программе важен.
    example: |
      city = "Казань"
      print(city)
      city = "Москва"
      print(city)
    aside: "Имя переменной — как подпись на коробке: подпись остаётся, а содержимое можно заменить."

  - id: m1.l1.s2
    type: theory
    title: "Правила имён"
    concepts: [variables, naming]
    body: |
      Имя переменной может состоять из латинских букв, цифр и знака подчёркивания `_`. Начинаться оно должно с буквы или `_`, но не с цифры. Пробелы и дефисы запрещены, а регистр важен: `Name` и `name` — разные переменные. Для читаемости используют нижний регистр и подчёркивания: `user_name`, `total_price`. Имя должно объяснять смысл: `age` лучше, чем `a`. Хорошее имя помогает читать код через неделю и тебе, и другому человеку. Если имя из двух слов, соединяй их подчёркиванием, а не пробелом. Служебные слова вроде `if` использовать нельзя, а имена команд вроде `print` лучше не перекрывать, иначе запутаешься. Короткие имена вроде `x` уместны только в математике или совсем маленьких примерах.
    example: |
      user_name = "Аня"
      user_city = "Казань"
      print(user_name)
      print(user_city)

  - id: m1.l1.s3
    type: quiz
    title: "Какое значение останется?"
    concepts: [variables]
    question: "Что выведет эта программа?"
    code: |
      color = "зелёный"
      color = "синий"
      print(color)
    options:
      - "зелёный"
      - "синий"
      - "оба значения"
      - "Ошибка"
    answers: [1]
    explanation: "Вторая строка заменяет значение переменной. print видит только последнее присваивание — «синий»."

  - id: m1.l1.s4
    type: blank
    title: "Заполни пропуски"
    concepts: [variables, string]
    prompt: "Допиши программу: переменной greeting присвой строку «Привет!», а затем выведи значение этой переменной."
    template: |
      greeting = {{1}}
      print({{2}})
    blanks:
      - answer: "\"Привет!\""
        accept: ["'Привет!'"]
        hint: "Строка в кавычках"
      - answer: "greeting"
        accept: []
        hint: "Имя переменной без кавычек"
    explanation: "Слева от = стоит имя переменной, справа — значение. В print передают имя, чтобы вывести сохранённое значение."

  - id: m1.l1.s5
    type: code
    title: "Сохрани три значения"
    concepts: [variables, naming, string, int]
    prompt: |
      Создай три переменные:

      - `hero` — строка `Питон`;
      - `level` — число `3`;
      - `mission` — строка `найти клад`.

      Выводить ничего не нужно: проверка заглянет в сами переменные. Имена должны совпадать точно.
    mode: unit
    starter: |
      # Создай переменные ниже
    tests:
      - name: "hero — строка"
        call: "hero"
        expected: "Питон"
      - name: "level — число"
        call: "level"
        expected: 3
      - name: "mission — строка"
        call: "mission"
        expected: "найти клад"
    hints:
      - "У каждой переменной есть имя и значение. Подумай, где в записи имя, а где значение."
      - "Слева от `=` пишут имя, справа — значение. Текст бери в кавычки, число пиши без кавычек."
      - "Структура: `имя = значение`. Начни с `hero`, затем `level` и `mission` — по одной строке на каждую."
    solution: |
      hero = "Питон"
      level = 3
      mission = "найти клад"
    explanation: "Присваивание создаёт переменные. Строки заключают в кавычки, числа пишут без них. Проверка сравнивает значения по именам."

  - id: m1.l1.s6
    type: debug
    title: "Найди ошибку: затёртая переменная"
    concepts: [variables, naming]
    prompt: |
      В программе три факта: имя, город и страна. Но третья строка записывает страну в `city` и затирает город. Исправь присваивание так, чтобы `city` остался `Казань`, а страна попала в `country`.

      Проверка посмотрит значения переменных `name`, `city` и `country`.
    mode: unit
    broken: |
      name = "Аня"
      city = "Казань"
      city = "Россия"
    tests:
      - name: "name"
        call: "name"
        expected: "Аня"
      - name: "city"
        call: "city"
        expected: "Казань"
      - name: "country"
        call: "country"
        expected: "Россия"
    hints:
      - "В программе три факта, а переменных в итоге две: одна строка использует не то имя."
      - "Стране нужно своё имя переменной — `country`, а не повторное `city`."
      - "Структура: три строки вида `имя = значение`; меняй только третью."
    solution: |
      name = "Аня"
      city = "Казань"
      country = "Россия"
    explanation: "Присваивание в существующую переменную заменяет старое значение. Для нового факта нужно новое имя — тогда город не потеряется."
