id: m1.l3
module: m1
title: "Строки и f-строки"
goal: "Собирать текст из строк, вставлять значения через f-строки и пользоваться strip и upper"
minutes: 9
order: 3
concepts: [string, fstring]
steps:
  - id: m1.l3.s1
    type: theory
    title: "Строки и склейка"
    concepts: [string]
    body: |
      Строка — это текст в кавычках. Кавычки могут быть двойными или одинарными, главное — парными. Внутри строки можно писать что угодно, включая пробелы и знаки препинания. Пустая строка `""` — тоже строка, просто без символов. Складывать строки можно оператором `+`: он склеивает их без пробела, поэтому пробел добавляют вручную. Склеивать можно сколько угодно строк, и порядок слагаемых задаёт порядок текста. Число и строку складывать нельзя: `"2" + 2` вызовет ошибку. Если внутри строки нужны кавычки того же вида, их экранируют обратной косой чертой. Например, `"Он сказал: \"привет\""` — допустимая строка.
    example: |
      first = "Привет"
      second = "мир"
      phrase = first + ", " + second + "!"
      print(phrase)
    aside: "Плюс у строк — это склейка, а не сложение. Поэтому `\"2\" + \"3\"` даёт `\"23\"`."

  - id: m1.l3.s2
    type: theory
    title: "f-строки и методы"
    concepts: [fstring, string]
    body: |
      f-строка — удобный способ вставить значение прямо в текст. Перед кавычками ставят букву `f`, а имя переменной заключают в фигурные скобки: `f"Привет, {name}!"`. Python заменит `{name}` на значение переменной. Без буквы `f` фигурные скобки останутся обычным текстом. Внутри скобок можно писать простые выражения, например `{2 + 3}`. Имена переменных внутри фигурных скобок пишут без кавычек. Ещё две полезные операции: `strip()` убирает пробелы по краям строки, а `upper()` переводит буквы в верхний регистр. Их можно объединять в цепочку: `.strip().upper()`. Методы не меняют исходную строку, а возвращают новую, поэтому результат нужно сохранить в переменную.
    example: |
      name = "  аня  "
      clean = name.strip().upper()
      print(f"Привет, {clean}!")

  - id: m1.l3.s3
    type: quiz
    title: "Строки не числа"
    concepts: [string]
    question: "Что выведет эта программа?"
    code: |
      print("2" + "3")
    options:
      - "23"
      - "5"
      - "2 3"
      - "Ошибка"
    answers: [0]
    explanation: "Плюс склеивает строки: получается «23», а не 5. Для сложения чисел нужны числа без кавычек."

  - id: m1.l3.s4
    type: blank
    title: "Подставь имя"
    concepts: [fstring]
    prompt: "Допиши f-строку так, чтобы она вывела «Привет, Аня!»."
    template: |
      name = "Аня"
      print(f"Привет, {{1}}!")
    blanks:
      - answer: "{name}"
        accept: []
        hint: "Имя переменной в фигурных скобках"
    explanation: "Внутри f-строки значение подставляют через `{name}`. Без фигурных скобок напечаталось бы слово name."

  - id: m1.l3.s5
    type: code
    title: "Собери приветствие"
    concepts: [string, fstring]
    prompt: |
      Дана строка с лишними пробелами: `raw_name = "  аня  "`.

      Создай переменные:

      - `raw_name` — исходная строка как есть;
      - `clean_name` — имя без пробелов по краям и заглавными буквами;
      - `message` — f-строка `Привет, <имя>!` с подставленным `clean_name`.

      Выводить ничего не нужно: проверка посмотрит значения переменных.
    mode: unit
    starter: |
      raw_name = "  аня  "
      # Создай clean_name и message ниже
    tests:
      - name: "raw_name не изменилась"
        call: "raw_name"
        expected: "  аня  "
      - name: "clean_name"
        call: "clean_name"
        expected: "АНЯ"
      - name: "message"
        call: "message"
        expected: "Привет, АНЯ!"
    hints:
      - "Подумай, какие две операции нужно сделать с именем и в каком порядке."
      - "Сначала убери пробелы по краям, потом поменяй регистр. Методы вызываются через точку и возвращают новую строку."
      - "Структура: три переменные. Третья — f-строка, а имя `clean_name` в ней стоит внутри фигурных скобок."
    solution: |
      raw_name = "  аня  "
      clean_name = raw_name.strip().upper()
      message = f"Привет, {clean_name}!"
    explanation: "`strip()` убирает пробелы, `upper()` поднимает регистр, а f-строка подставляет результат в текст. Исходная строка не меняется: строки неизменяемы."

  - id: m1.l3.s6
    type: debug
    title: "Найди ошибку: забытая буква"
    concepts: [fstring, string]
    prompt: |
      Программа должна собрать приветствие «Привет, Иван Петров!», но в `message` попали фигурные скобки вместо значения. Найди причину и исправь одну строку. Переменная `shout` пересчитается сама.
    mode: unit
    broken: |
      first = "Иван"
      last = "Петров"
      full = first + " " + last
      message = "Привет, {full}!"
      shout = message.upper()
    tests:
      - name: "full"
        call: "full"
        expected: "Иван Петров"
      - name: "message"
        call: "message"
        expected: "Привет, Иван Петров!"
      - name: "shout"
        call: "shout"
        expected: "ПРИВЕТ, ИВАН ПЕТРОВ!"
    hints:
      - "Сравни строку `message` с соседними: в ней есть фигурные скобки, которые почему-то не заменились."
      - "Python подставляет значения только в f-строки. Посмотри на символы перед кавычками."
      - "Структура: сравни самое начало строки `message` с записью f-строки из теории. Остальные строки не меняй."
    solution: |
      first = "Иван"
      last = "Петров"
      full = first + " " + last
      message = f"Привет, {full}!"
      shout = message.upper()
    explanation: "Без префикса `f` строка остаётся обычным текстом, и `{full}` печатается как есть. С `f` Python подставляет значение, а `shout` получает уже исправленный текст."
